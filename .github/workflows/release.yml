name: Publish OXGEN
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: false
      - run: go test ./... -count=1
      - run: go vet ./...
  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Build six platforms and checksum manifests
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          go run ./cmd/pack -version "$version" -out dist/github -github-repository "$GITHUB_REPOSITORY"
      - name: Upload and publish a complete release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true ] || { echo 'This version is already published; create a new tag.'; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "OXGEN $GITHUB_REF_NAME" --notes-file docs/RELEASE-NOTES.md
          fi
          gh release upload "$GITHUB_REF_NAME" dist/github/releases/"$version"/* dist/github/manifest.json dist/github/manifest.tsv dist/github/install.ps1 dist/github/install.sh --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
