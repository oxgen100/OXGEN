name: Validate OXGEN
on:
  workflow_dispatch:
  push:
    paths: ['**/*.go', 'go.mod', 'scripts/**', '.github/workflows/validate.yml']
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: false
      - run: go test ./... -count=1
      - run: go vet ./...
      - run: go build ./cmd/oxgen
  isolated-windows-runtime:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Verify official Node and complete Python without installing system software
        shell: pwsh
        run: |
          $env:OXGEN_LIVE_DIR = Join-Path $env:RUNNER_TEMP 'OXGEN 隔离验证 space'
          go test ./internal/oxgen -run TestLiveOfficialRuntimes -v -count=1 -timeout 20m
